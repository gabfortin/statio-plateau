name: Update OSM data snapshot

on:
  schedule:
    - cron: "17 8 * * 1"   # every Monday, 08:17 UTC
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-osm-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest data from Overpass
        # A failed fetch keeps the previous snapshot; don't fail the job for it
        run: python scripts/update_osm_data.py || echo "::warning::Some datasets could not be refreshed"

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update OSM data snapshot"
          git push
